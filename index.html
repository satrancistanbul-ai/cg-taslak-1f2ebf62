<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chessigo — Ünite 1 taslağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3B2314; --wood:#7A4A24; --wood-d:#4E2E14; --wood-l:#A0703F;
  --orange:#F6A12B; --orange-d:#C9731A; --yellow:#FCC73C; --red:#D7261E;
  --parch:#FFF4DC; --parch-d:#EBD7AE; --grass:#6DAA3F; --grass-d:#4C7F2A;
  --sq-l:#F3F3EE; --sq-d:#74A64A;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#2a1a0e;font-family:var(--font);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#8FD0EE;border-radius:18px}
.screen{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
button{font-family:var(--font);cursor:pointer;border:none;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,.sq:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

.btn{background:var(--orange);color:var(--ink);font-weight:800;font-size:24px;padding:10px 30px;border-radius:16px;border:3px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--parch)}
.btn.small{font-size:18px;padding:4px 16px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn[disabled]{background:#d8cbb0;color:#8d7a5e;border-color:#8d7a5e;box-shadow:0 5px 0 #8d7a5e;cursor:default}
.iconbtn{background:var(--parch);border:3px solid var(--ink);border-radius:12px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;padding:0 12px;gap:6px;box-shadow:0 3px 0 var(--ink)}
.back{position:absolute;left:14px;top:12px;z-index:5}

.goldbox{display:inline-flex;align-items:center;gap:6px;background:var(--wood-d);color:var(--yellow);font-weight:800;font-size:20px;border-radius:22px;
  padding:4px 14px 4px 6px;height:44px;border:3px solid var(--yellow)}
.goldbox.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.2)}}
.coin{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0B0,var(--yellow) 55%,var(--orange-d));border:2px solid #8a5200;position:relative}
.coin::after{content:"♟\FE0E";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#8a5200;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.flycoin{position:absolute;z-index:50;width:32px;height:32px;pointer-events:none;transition:left .7s cubic-bezier(.5,-.3,.7,1),top .7s cubic-bezier(.3,0,.3,1.2),transform .7s}

.parch{background:var(--parch);border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 rgba(59,35,20,.55)}
.field{display:block;width:100%;font-family:var(--font);font-size:20px;padding:6px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin:2px 0 10px}
label.l{font-weight:700;font-size:17px}
.link{color:var(--wood-d);font-weight:700;text-decoration:underline;background:none;font-size:16px;padding:0}
.hint{font-size:16px;font-weight:600;color:#7a6146}

.scrim{position:absolute;inset:0;background:rgba(40,22,10,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:absolute;left:0;top:0;bottom:0;width:300px;background:var(--parch);z-index:21;border-right:4px solid var(--ink);transform:translateX(-100%);transition:transform .25s;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.panel.open{transform:none}
.panel button.item{background:none;text-align:left;font-size:22px;font-weight:700;padding:6px 10px;border-radius:12px}
.panel button.item:hover{background:var(--parch-d)}
.panel .soon{font-size:14px;color:#9a8266;font-weight:600;margin-left:6px}

.toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;font-weight:700;font-size:18px;padding:8px 20px;border-radius:14px;z-index:60;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}

.stat{background:var(--parch);border:3px solid var(--ink);border-radius:16px;padding:4px 14px;text-align:center;min-width:140px;box-shadow:0 4px 0 rgba(59,35,20,.5)}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:15px;font-weight:700;color:var(--wood)}
.rank{display:flex;gap:4px;justify-content:center;margin-top:2px}
.rank i{font-style:normal;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:#e2d3b3;color:#9a8266;
  font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.rank i.on{background:var(--orange);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

.platform{position:absolute;left:34px;top:300px;width:320px;height:190px}
.platform .disc{position:absolute;left:10px;right:10px;bottom:4px;height:72px;border-radius:50%;background:var(--wood);border:4px solid var(--ink);box-shadow:0 10px 0 var(--wood-d)}
.platform .disc2{position:absolute;left:36px;right:36px;bottom:26px;height:46px;border-radius:50%;background:var(--wood-l);border:3px solid var(--ink)}
.platform .go{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font-size:32px;padding:8px 40px;white-space:nowrap}
.platform .gp{position:absolute;font-size:46px;color:var(--parch);-webkit-text-stroke:2px var(--ink);font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;line-height:1}

.mapscroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;
  border:4px solid var(--ink);background:var(--orange);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.node.locked{background:#cdbf9f;color:#7a6146;cursor:default}
.node.done{background:var(--grass);color:#fff}
.node.cur{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),0 0 0 12px rgba(252,199,60,.45)}}
.nodelabel{position:absolute;transform:translateX(-50%);font-weight:800;font-size:15px;background:var(--parch);border-radius:8px;padding:0 8px;border:2px solid var(--ink);white-space:nowrap}

.bubble{position:absolute;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:12px 20px;font-weight:700;font-size:23px;line-height:1.25;max-width:400px;
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);z-index:6}
.bubble.in{opacity:1;transform:scale(1)}
.bubble b.who{display:block;font-size:15px;color:var(--orange-d)}
.bubble::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border:4px solid var(--ink);border-top:none;border-left:none}
.bubble.tail-right::after{right:-15px;bottom:24px;transform:rotate(-45deg)}
.bubble.tail-left::after{left:-15px;bottom:24px;transform:rotate(135deg)}
.bubble.tail-down::after{left:40px;bottom:-15px;transform:rotate(45deg)}

.list{position:absolute;left:380px;right:20px;top:66px;bottom:14px;overflow-y:auto;padding:6px 10px 10px 4px}
.row{display:flex;align-items:center;gap:14px;background:var(--parch);border:3px solid var(--ink);border-radius:16px;padding:7px 12px;margin-bottom:10px}
.row .num{width:40px;height:40px;border-radius:50%;background:var(--wood);color:var(--yellow);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--ink)}
.row.done .num{background:var(--grass);color:#fff}
.row.locked{opacity:.6}
.row .t{flex:1;font-weight:700;font-size:20px;line-height:1.15}
.row .t small{display:block;font-size:14px;color:#9a8266;font-weight:600}
.bar{height:16px;background:#e2d3b3;border-radius:8px;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass)}

.screenframe{position:absolute;background:var(--wood);border:6px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 8px 0 var(--wood-d)}
.vscreen{background:#1f3a2b;border-radius:8px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.play{width:88px;height:88px;border-radius:50%;background:var(--orange);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
.play::before{content:"";border-left:32px solid var(--ink);border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:8px}

.qtop{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 140px;z-index:3}
.qtop .title{font-weight:800;font-size:20px;background:var(--parch);border:3px solid var(--ink);border-radius:12px;padding:2px 12px}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;background:#e2d3b3;border:2px solid var(--ink)}
.dots i.on{background:var(--orange)}.dots i.ok{background:var(--grass)}
.qcard{position:absolute;padding:16px 22px}
.qtext{font-weight:700;font-size:26px;line-height:1.25;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:16px;font-size:21px;font-weight:700;padding:14px 12px;text-align:left;line-height:1.2;box-shadow:0 4px 0 var(--ink)}
.opt b{color:var(--orange-d);margin-right:6px}
.opt.ok{background:#e1f2d3;border-color:var(--grass-d)}
.opt.bad{background:#f9ddd6;border-color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{font-weight:800;font-size:22px;min-height:32px;margin-top:8px}
.feedback.ok{color:var(--grass-d)}.feedback.bad{color:var(--red)}

/* Stone-framed board */
.bframe{display:inline-block;padding:10px 12px 4px 4px;border-radius:14px;border:4px solid var(--ink);
  background-color:#8a5a30;background-image:linear-gradient(90deg,rgba(59,35,20,.35) 3px,transparent 3px),linear-gradient(rgba(59,35,20,.35) 3px,transparent 3px);
  background-size:52px 30px;box-shadow:inset 0 0 0 4px #a8773f,0 7px 0 var(--wood-d)}
.board{display:grid;grid-template-columns:20px repeat(8,40px);grid-template-rows:repeat(8,40px) 22px}
.board.nocoord .coord{color:transparent;text-shadow:none}
.coord{color:var(--yellow);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 var(--ink)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;cursor:pointer;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.board .r0{border-top-left-radius:10px}.board .r1{border-top-right-radius:10px}.board .r2{border-bottom-left-radius:10px}.board .r3{border-bottom-right-radius:10px}
.pc{position:relative;z-index:2}
.pc.w{color:#fff;-webkit-text-stroke:1.6px var(--ink)}
.pc.b{color:var(--ink)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--orange)}
.sq.mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:rgba(252,199,60,.9);border:3px solid var(--orange-d);z-index:1}
.sq.good{box-shadow:inset 0 0 0 4px #2f7d1a;background:#bfe3a8}
.sq.wrong{box-shadow:inset 0 0 0 4px var(--red)}
.sq.goalsq{background:#FCC73C}

.items{position:absolute;left:380px;right:20px;top:70px;bottom:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.item{background:var(--parch);border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.item .nm{font-weight:800;font-size:16px;line-height:1.1}
.item .pr{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--orange-d)}
.item .pr .coin{width:20px;height:20px}.item .pr .coin::after{font-size:10px}

.pick{width:230px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;border-radius:22px}
.pick.sel{background:var(--yellow)}

#rotate{position:fixed;inset:0;background:#2a1a0e;color:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#rotate .ph{width:70px;height:120px;border:6px solid var(--orange);border-radius:14px;animation:rot 2s infinite ease-in-out}
@keyframes rot{40%,70%{transform:rotate(-90deg)}}
#rotate p{font-size:24px;font-weight:700;margin:0;max-width:300px}
@media (orientation:portrait){body:not(.force) #rotate{display:flex}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.opts.two{grid-template-columns:repeat(2,1fr)}
.items{overflow-y:auto;padding:2px 4px 4px 0;scrollbar-width:none}.items::-webkit-scrollbar{display:none}
.birds{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.sbird{position:absolute;left:1030px;top:34px;width:160px;height:81px;background-size:960px 324px;animation:fly 30s linear infinite}
@keyframes fly{0%{left:1030px;margin-top:8px}50%{margin-top:-14px}100%{left:-170px;margin-top:0}}
.fly{position:absolute;z-index:1;pointer-events:none;animation:flit 6s ease-in-out infinite}
@keyframes flit{0%{transform:translate(0,0)}25%{transform:translate(26px,-18px)}50%{transform:translate(52px,4px)}75%{transform:translate(20px,-22px)}100%{transform:translate(0,0)}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="rotate"><div class="ph"></div><p>Chessigo yatay oynanır. Telefonunu yan çevir.</p>
<button class="btn small" onclick="document.body.classList.add('force');fit()">Yine de devam et</button></div>

function makeBoard(el,pos,{coords=true,onTap}={}){const F='abcdefgh';
  const api={pos,marks:new Set(),sel:null,flags:{},draw(){el.innerHTML='';el.className='board'+(coords?'':' nocoord');
    for(let r=8;r>=1;r--){el.insertAdjacentHTML('beforeend',`<div class="coord">${r}</div>`);
      for(let f=0;f<8;f++){const s=F[f]+r,p=api.pos[s];const q=document.createElement('div');
        q.className='sq '+((f+r)%2?'d':'l')+(api.marks.has(s)?' mark':'')+(api.sel===s?' sel':'')+(api.flags[s]?' '+api.flags[s]:'')+(s==='a8'?' r0':s==='h8'?' r1':s==='a1'?' r2':s==='h1'?' r3':'');
        q.dataset.s=s;q.tabIndex=0;q.setAttribute('role','button');q.setAttribute('aria-label',s+(p?' taş var':''));
        if(p)q.innerHTML=`<span class="pc ${p===p.toUpperCase()?'w':'b'}">${GLY[p.toUpperCase()]}${G}</span>`;
        q.onclick=()=>onTap&&onTap(s,q);q.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap&&onTap(s,q)}};el.appendChild(q)}}
    el.insertAdjacentHTML('beforeend','<div></div>'+F.split('').map(f=>`<div class="coord">${f}</div>`).join(''))},
    sq:s=>el.querySelector(`[data-s="${s}"]`)};
  api.draw();return api}

  d.innerHTML=vbg(.35)+`<div style="position:absolute;left:0;right:0;top:20px;text-align:center;color:#fff;font-weight:800;font-size:34px;text-shadow:0 3px 0 var(--ink)">Karakterini seç</div>

     <button class="pick parch" data-g="k" aria-label="Kız karakter"><div style="width:170px;height:280px">${kid('k')}</div></button></div>
   <div class="parch" style="position:absolute;right:34px;top:120px;width:290px;padding:16px 20px">
     <label class="l" for="nm">Oyuncu adın</label><input class="field" id="nm" maxlength="14" value="${S.nick||''}" placeholder="örn. Yıldız07">

  const valid=()=>sel&&/^[A-Za-z0-9ÇĞİÖŞÜçğıöşü_]{3,14}$/.test(nm.value.trim());

  nm.oninput=upd;if(sel)d.querySelector(`[data-g="${sel}"]`).classList.add('sel');upd();
  ok.onclick=()=>{const nick=nm.value.trim(),id=pid(nick);

function closePanel(){$('.scrim').classList.remove('open');$('.panel').classList.remove('open')}
function continueGame(){if(S.unitDone||!doneCount())return go(scMap);go(scUnit)}

function flowers(x,y,k){const C=['#E4572E','#FCC73C','#B06AD9','#FF8FB1','#FFFFFF'];let s=`<ellipse cx="${x}" cy="${y+6}" rx="22" ry="7" fill="#3E7D25" opacity=".55"/>`;
  for(let j=0;j<5;j++){const fx=x-14+j*7,fy=y-((j*13+k*7)%9);s+=`<path d="M${fx} ${y+6} L${fx} ${fy+4}" stroke="#3E7D25" stroke-width="2"/><circle cx="${fx}" cy="${fy}" r="4.5" fill="${C[(j+k)%5]}" stroke="${INK}" stroke-width="1.5"/><circle cx="${fx}" cy="${fy}" r="1.5" fill="#FCC73C"/>`}return s}
function lantern(x,y){return `<rect x="${x-2.5}" y="${y-58}" width="5" height="60" fill="#4E2E14"/><path d="M${x} ${y-58} L${x+14} ${y-58}" stroke="#4E2E14" stroke-width="4"/>
  <rect x="${x+7}" y="${y-56}" width="14" height="17" rx="3" fill="#FFE08A" stroke="${INK}" stroke-width="2"/><circle cx="${x+14}" cy="${y-47}" r="14" fill="#FFE08A" opacity=".35"/>`}
function mushroom(x,y){return `<rect x="${x-4}" y="${y-12}" width="8" height="13" rx="3" fill="#FFF4DC" stroke="${INK}" stroke-width="2"/><path d="M${x-13} ${y-11} Q${x} ${y-32} ${x+13} ${y-11}Z" fill="#E4572E" stroke="${INK}" stroke-width="2"/><circle cx="${x-4}" cy="${y-18}" r="2.5" fill="#fff"/><circle cx="${x+5}" cy="${y-15}" r="2" fill="#fff"/>`}
function bunting(a,b){const x1=a.x+34,y1=a.y-78,x2=b.x-34,y2=b.y-78,mx=(x1+x2)/2,my=Math.max(y1,y2)+22;const C=['#E4572E','#FCC73C','#4F7FB8','#74A64A','#B06AD9'];
  let s=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" stroke="${INK}" stroke-width="2" fill="none"/>`;
  for(let t=1;t<8;t++){const u=t/8,x=(1-u)*(1-u)*x1+2*u*(1-u)*mx+u*u*x2,y=(1-u)*(1-u)*y1+2*u*(1-u)*my+u*u*y2;s+=`<path d="M${x-7} ${y} L${x+7} ${y} L${x} ${y+15}Z" fill="${C[t%5]}" stroke="${INK}" stroke-width="1.5"/>`}
  return s+`<rect x="${x1-3}" y="${y1}" width="6" height="${a.y-y1-20}" fill="#4E2E14"/><rect x="${x2-3}" y="${y2}" width="6" height="${b.y-y2-20}" fill="#4E2E14"/>`}
function scMap(d){
  const N=20,STEP=150,pts=[...Array(N)].map((_,i)=>({x:150+i*STEP,y:418+Math.sin(i*.9)*46}));const W=pts[N-1].x+220,T=Math.ceil(W/960);
  let path=`M${pts[0].x-160} ${pts[0].y+30} C${pts[0].x-80} ${pts[0].y+30} ${pts[0].x-60} ${pts[0].y} ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<N;i++){const p=pts[i-1],q=pts[i];path+=` C${p.x+75} ${p.y} ${q.x-75} ${q.y} ${q.x} ${q.y}`}
  let deco='',flags='';
  for(let i=0;i<N-1;i++){const a=pts[i],b=pts[i+1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(i%2===0)deco+=bunting(a,b);
    deco+=flowers(mx+(i%3-1)*14,my+(i%2?-44:52),i);
    if(i%3===1)deco+=lantern(mx-30,my-26);
    if(i%4===2)deco+=mushroom(mx+34,my+58);}
  const cur=S.villages-1;
  pts.forEach((p,i)=>{const open=i<S.villages,done=i===0&&S.unitDone;
    if(open)flags+=`<rect x="${p.x+24}" y="${p.y-74}" width="4" height="56" fill="#4E2E14"/><path d="M${p.x+28} ${p.y-74} L${p.x+60} ${p.y-64} L${p.x+28} ${p.y-54}Z" fill="${done?'#74A64A':'#F6A12B'}" stroke="${INK}" stroke-width="2"/>`});
  const nodes=pts.map((p,i)=>{const open=i<S.villages,done=i===0&&S.unitDone;
    return `<button class="node ${open?'':'locked'} ${done?'done':''} ${i===cur&&!done?'cur':''}" style="left:${p.x}px;top:${p.y}px" aria-label="${i+1}. köy${open?'':' kilitli'}" onclick="tapVillage(${i})">${open?(done?'✓':i+1):'🔒'}</button>
    <div class="nodelabel" style="left:${p.x}px;top:${p.y+38}px;background:var(--wood);color:var(--yellow)">${i+1}. Köy</div>`}).join('');
  const tiles=[...Array(T)].map((_,t)=>`<div style="position:absolute;left:${t*960}px;top:0;width:960px;height:540px;background:url(${IMG.village}) center/cover;${t%2?'transform:scaleX(-1)':''}"></div>`).join('');
  d.innerHTML=`<div class="mapscroll" id="ms"><div style="position:relative;width:${W}px;height:540px;overflow:hidden">${tiles}
    <div style="position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,0) 50%,rgba(255,244,220,.25))"></div>
    <svg viewBox="0 0 ${W} 540" width="${W}" height="540" style="position:absolute;inset:0" aria-hidden="true">
      <path d="${path}" transform="translate(0 7)" stroke="rgba(59,35,20,.3)" stroke-width="56" fill="none" stroke-linecap="round"/>
      <path d="${path}" stroke="#8B5A2B" stroke-width="54" fill="none" stroke-linecap="round"/>
      <path d="${path}" stroke="#F2D59B" stroke-width="44" fill="none" stroke-linecap="round"/>
      <path d="${path}" stroke="#E0B874" stroke-width="3" stroke-dasharray="3 20" fill="none" stroke-linecap="round"/>
      ${deco}${flags}</svg>${nodes}
    <div id="mappawn" style="position:absolute;left:${pts[cur].x-112}px;top:${pts[cur].y-150}px;width:84px;height:138px">${me()}</div></div></div>
  ${birds()}<button class="iconbtn back" onclick="go(scHome)">‹ Geri</button><div style="position:absolute;right:16px;top:12px">${goldbox()}</div>`;
  d.querySelector('#ms').scrollLeft=Math.max(0,pts[cur].x-300);
}
function tapVillage(i){if(i>=S.villages)return toast(`${i+1}. köy henüz kilitli`);if(i>0)return toast(`${i+1}. ünite yakında`);
  const p=$('#mappawn');const b=document.createElement('div');b.className='bubble tail-down';b.style.cssText+=`left:${parseFloat(p.style.left)-10}px;top:${parseFloat(p.style.top)-66}px;font-size:21px`;
  b.textContent='Hadi başlıyoruz!';p.parentNode.appendChild(b);requestAnimationFrame(()=>b.classList.add('in'));p.innerHTML=me('yay');setTimeout(()=>go(scUnit),1300)}

  d.innerHTML=`<div class="bg" style="background-image:url(${IMG.classroom});background-size:1920px 1080px;background-position:-528px -312px"></div>
   <div style="position:absolute;left:320px;top:334px;width:300px;text-align:center;color:#EAF4EC;font-weight:700;font-size:20px;line-height:1.15;font-family:'Comic Sans MS','Baloo 2',cursive;opacity:.92">${esc(title)}</div>
   <div style="position:absolute;left:600px;top:150px;width:250px;height:338px">${hoca(opts.prop||'')}</div>
   <img src="${IMG.table}" alt="" style="position:absolute;left:470px;top:400px;width:520px">
   <div class="parch" style="position:absolute;left:18px;bottom:14px;width:190px;height:190px;overflow:hidden;border-radius:26px;padding:0;background:linear-gradient(#FFF4DC,#EBD7AE)">
     <div id="pw" style="position:absolute;left:5px;top:10px;width:180px;height:298px">${me()}</div></div>
   <button class="btn" id="dn" style="position:absolute;right:24px;bottom:18px;z-index:7" disabled>Devam</button>`;
  let i=0;const dn=d.querySelector('#dn');
  function show(){d.querySelectorAll('.bubble').forEach(b=>b.remove());const ln=lines[i];const b=document.createElement('div');const isH=ln.w==='h',isN=ln.w==='n';
    b.className='bubble '+(isH?'tail-right':'tail-left');
    b.style.cssText+=isH?'right:370px;top:40px;max-width:380px':'left:228px;bottom:110px';
    b.innerHTML=`<b class="who">${isH?'Satranç İstanbul Antrenörü':isN?esc(ln.who):esc(S.nick||'Sen')}</b>${esc(String(ln.t).replace(/\{ad\}/g,S.nick||'şampiyon'))}`;d.appendChild(b);requestAnimationFrame(()=>b.classList.add('in'));
    d.querySelector('#pw').innerHTML=isN?kid(ln.g):me(!isH&&ln.yay?'yay':undefined);
    dn.disabled=false;dn.focus()}
  dn.onclick=()=>{i++;if(i<lines.length){dn.disabled=true;show()}else next()};setTimeout(show,350);
}
function startLesson(i){const l=UNIT.lessons[i];LS={mode:'lesson',i,q:0,qs:l.qs,ilk:0};
  const lines=l.dlg.map(x=>x.k==='antrenor'?{w:'h',t:x.m}:{w:'n',who:PEER[x.k][0],g:PEER[x.k][1],t:x.m});
  go(scDialog,lines,()=>go(scVideo))}
function startTest(){LS={mode:'test',i:-1,q:0,qs:TEST,ilk:0};
  go(scDialog,[{w:'h',t:`${DATA.unite_testi.baslik} başlıyor, {ad}! 10 soru var. En az 8 tanesini ilk denemede bilirsen bir sonraki köyün kapısı açılır.`},{w:'p',t:'Hazırım!',yay:true}],()=>go(scQuiz),{prop:'paper',title:DATA.unite_testi.baslik})}

const vscreen=(t,st)=>`<div class="screenframe" style="${st}"><div class="vscreen">
    <button class="play" id="pl" aria-label="Videoyu oynat"></button>
    <div id="vt" style="margin-top:16px;font-size:20px;font-weight:700;opacity:.92;text-align:center;padding:0 36px;line-height:1.2">${t}</div>
    <div style="position:absolute;left:16px;right:16px;bottom:12px;height:8px;background:rgba(255,255,255,.2);border-radius:4px"><i id="vp" style="display:block;height:100%;width:0;background:var(--orange);border-radius:4px"></i></div></div></div>`;
function simVideo(d,akis,done){d.querySelector('#pl').onclick=e=>{e.currentTarget.style.visibility='hidden';const vt=d.querySelector('#vt'),vp=d.querySelector('#vp'),ab=d.querySelector('#ab');let t=0;
  const iv=setInterval(()=>{if(!vp.isConnected)return clearInterval(iv);t+=2;vp.style.width=t+'%';vt.textContent=akis[Math.min(akis.length-1,Math.floor(t/100*akis.length))];
    if(t>=100){clearInterval(iv);vt.textContent='Video bitti!';if(ab)ab.innerHTML='<b class="who">Satranç İstanbul Antrenörü</b>Harika! Şimdi öğrendiklerini deneyelim.';done()}},90)}}
const CLASSVIDEO=(title,v,back,btn)=>cbg(.15)+`<button class="iconbtn back" onclick="${back}">‹ Geri</button>
  <div style="position:absolute;left:0;right:0;top:12px;text-align:center"><span class="parch" style="padding:2px 16px;font-weight:800;font-size:22px;border-radius:12px;border-width:3px">${esc(title)}</span></div>
  ${vscreen(`${esc(v.baslik)}<br><small style="opacity:.75;font-weight:600">${esc(v.sure)} · antrenörün ders videosu burada oynayacak</small>`,'left:34px;top:70px;width:600px;height:338px')}
  <div style="position:absolute;left:668px;top:190px;width:250px;height:338px" class="float">${hoca()}</div>
  <div id="ab" class="bubble tail-down in" style="right:24px;top:70px;max-width:290px;font-size:20px"><b class="who">Satranç İstanbul Antrenörü</b>Şimdi bu konuyu birlikte izleyelim. Oynat tuşuna dokun.</div>${btn}`;
function scVideo(d){const l=UNIT.lessons[LS.i];
  d.innerHTML=CLASSVIDEO(`${LS.i+1}. ${l.t}`,l.video,'go(scUnit)',`<button class="btn" id="tt" style="position:absolute;left:34px;bottom:18px" disabled onclick="go(scTestIntro)">Teste geç</button>
  <button class="link" style="position:absolute;left:220px;bottom:32px;color:#fff" onclick="go(scTestIntro)">Videoyu atla (taslak)</button>`);

}
function scTestIntro(d){scDialog(d,[{w:'h',t:'Şimdi öğrendiklerimizi test etme zamanı!'}],()=>go(scQuiz),{prop:'paper'})}

function scQuiz(d){
  const q=LS.qs[LS.q],test=LS.mode==='test',N=LS.qs.length,last=LS.q===N-1;let tries=0,solved=false;
  const dots=LS.qs.map((_,k)=>`<i class="${k<LS.q?'ok':k===LS.q?'on':''}"></i>`).join('');
  const hl=()=>Object.fromEntries((q.hl||[]).map(s=>[s,'goalsq']));
  d.innerHTML=vbg(.4)+`<button class="iconbtn back" onclick="go(scUnit)">‹ Ünite</button>
   <div class="qtop"><div style="display:flex;align-items:center;gap:16px"><span class="title">${test?`Test · ${LS.q+1}/${N}`:`${LS.q+1}. Soru`}</span><div class="dots">${dots}</div></div>${goldbox()}</div>`;
  const fb=()=>d.querySelector('.feedback');
  const nb=`<button class="btn" id="nx" style="position:absolute;right:26px;bottom:18px;visibility:hidden;z-index:4" onclick="nextQ()">${last?(test?'Testi bitir':'Bölümü bitir'):'Sonraki soru'}</button>`;
  function win(el){if(solved)return;solved=true;let earn=0;if(tries===0)LS.ilk++;
    if(!test){const key=LS.i+'-'+LS.q;if(!S.paid[key]){earn=tries===0?10:5;S.paid[key]=1;S.correct++}}
    fb().className='feedback ok';fb().innerHTML=(earn?`Doğru! +${earn} altın`:'Doğru!')+(q.e?`<div class="hint" style="font-weight:600;margin-top:2px">${esc(q.e)}</div>`:'');
    if(earn)flyCoin(el,earn);save();const n=d.querySelector('#nx');n.style.visibility='visible';n.focus()}
  function lose(el,msg){tries++;fb().className='feedback bad';fb().innerHTML=(msg||'Olmadı, tekrar dene!')+(q.h?`<div class="hint">İpucu: ${esc(q.h)}</div>`:'');
    if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}
  const hasBoard=!!q.pos;let wrap=null;
  if(hasBoard){wrap=document.createElement('div');wrap.style.cssText='position:absolute;left:40px;top:72px';wrap.innerHTML='<div class="bframe"><div id="bd"></div></div>';d.appendChild(wrap)}
  const c=document.createElement('div');c.className='qcard parch';
  if(q.t==='mc'){c.style.cssText+=hasBoard?'left:470px;right:30px;top:84px':'left:40px;right:40px;top:84px';
    c.innerHTML=`<p class="qtext" style="font-size:${hasBoard?26:30}px">${esc(q.q)}</p><div class="opts${!hasBoard&&q.o.length===4?' two':''}" ${hasBoard?'style="grid-template-columns:1fr"':''}>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${'abcd'[k]})</b>${esc(o)}</button>`).join('')}</div><div class="feedback"></div>`;
    d.appendChild(c);
    if(hasBoard){const B=makeBoard(wrap.querySelector('#bd'),{...q.pos},{});B.flags=hl();B.draw()}

  c.style.cssText+='left:470px;right:30px;top:84px';

  const B=makeBoard(wrap.querySelector('#bd'),{...q.pos},{onTap:(s)=>{if(solved)return;B.flags=hl();
    if(q.t==='mark'){B.marks.has(s)?B.marks.delete(s):B.marks.add(s);B.draw();return}
    const p=B.pos[s];
    if(B.sel===null){if(p&&p===p.toUpperCase()){B.sel=s;B.draw()}else lose(null,'Önce kendi (beyaz) taşına dokun.');return}
    if(s===B.sel||(p&&p===p.toUpperCase())){B.sel=s===B.sel?null:s;B.draw();return}
    if(B.sel===q.a[0]&&q.a.slice(1).includes(s)){B.pos[s]=B.pos[B.sel];delete B.pos[B.sel];B.sel=null;B.flags[s]='good';B.draw();win(B.sq(s))}
    else{B.sel=null;B.flags={...hl(),[s]:'wrong'};B.draw();lose(wrap,'Bu hamle olmadı, tekrar dene!');setTimeout(()=>{B.flags=hl();B.draw()},600)}}});
  B.flags=hl();B.draw();
  if(q.t==='mark')c.querySelector('#ck').onclick=()=>{if(solved)return;const ok=q.a.length===B.marks.size&&q.a.every(s=>B.marks.has(s));

}

const BOOKPAGES={A:{p:12,t:'Kale nereye gidebilir?'},B:{p:13,t:'Kale neyi alabilir?'},C:{p:14,t:'Kale yolculuğu'}};
const PILOT_CODE='KALE2026';
function bstat(k,i){return (S.book||{})[k+i]}
function setB(k,i,v){S.book=S.book||{};if(S.book[k+i]!=='ok')S.book[k+i]=v;save()}
function scBook(d,then){
  if(!S.bookCode){
    d.innerHTML=vbg(.5)+`<button class="iconbtn back" onclick="go(scHome)">‹ Geri</button>
     <div class="parch" style="position:absolute;left:220px;right:220px;top:90px;padding:22px 26px;text-align:center">
       <div style="font-weight:800;font-size:26px">Kitap Çözümleri</div>
       <div class="hint" style="margin:6px 0 14px">Kitabının ilk sayfasındaki kodu yaz. Bu bölüm oyundan ayrıdır: kitaptaki alıştırmaları burada çözüp kontrol edersin.</div>
       <input class="field" id="bc" placeholder="Kitap kodu" style="text-align:center;text-transform:uppercase" maxlength="12">
       <button class="btn" id="bo" style="width:100%">Kilidi aç</button>
       <div class="hint" id="bh" style="margin-top:10px">Pilot kodu: ${PILOT_CODE}</div></div>`;
    const go2=()=>{if(d.querySelector('#bc').value.trim().toUpperCase()===PILOT_CODE){S.bookCode=PILOT_CODE;save();then?then():go(scBook)}else{const h=d.querySelector('#bh');h.textContent='Kod hatalı, kitabının ilk sayfasına tekrar bak.';h.style.color='var(--red)'}};
    d.querySelector('#bo').onclick=go2;d.querySelector('#bc').onkeydown=e=>{if(e.key==='Enter')go2()};return}
  const rows=Object.entries(BOOKPAGES).map(([k,v])=>{const n=BOOK[k].length,ok=BOOK[k].filter((_,i)=>bstat(k,i)==='ok').length;
    return `<div class="row"><div class="num">${k}</div><div class="t">Sayfa ${v.p} · ${v.t}<small>${ok} / ${n} soru çözüldü</small></div><button class="btn small" onclick="go(scBookPage,'${k}')">Aç</button></div>`}).join('');
  d.innerHTML=vbg(.5)+`<button class="iconbtn back" onclick="go(scHome)">‹ Geri</button>
   <div style="position:absolute;left:0;right:0;top:12px;text-align:center"><span class="parch" style="padding:2px 18px;font-weight:800;font-size:24px;border-radius:12px;border-width:3px">Kitap Çözümleri</span></div>
   <div class="parch" style="position:absolute;left:150px;right:150px;top:70px;bottom:16px;padding:14px 18px;overflow-y:auto">
     <div style="font-weight:800;font-size:20px;margin-bottom:8px">Kitap 1  ›  Ünite 1  ›  Konu 4: Kale</div>${bookVideoRow()}${rows}
     <div class="hint" style="margin-top:6px">Diğer konuların sayfaları hazırlandıkça burada açılacak.</div></div>`;
}
const bookVideoRow=()=>`<div class="row"><div class="num" style="background:var(--orange);color:var(--ink)">▶</div><div class="t">Konu videosu · ${esc(UNIT.lessons[3].t)}<small>${esc(UNIT.lessons[3].video.sure)} · önce videoyu izle, sonra alıştırmalar</small></div><button class="btn small" onclick="go(scBookVideo)">İzle</button></div>`;
function scBookVideo(d){const l=UNIT.lessons[3];
  d.innerHTML=CLASSVIDEO('Konu 4: '+l.t,l.video,'go(scBook)',`<button class="btn" id="tt" style="position:absolute;left:34px;bottom:18px" disabled onclick="go(scBookPage,'A')">Alıştırmalara geç</button>`);
  simVideo(d,l.video.akis,()=>{const b=d.querySelector('#tt');b.disabled=false;b.focus()})}
function scBookPage(d,k){
  if(!S.bookCode)return scBook(d,()=>go(scBookPage,k));
  const L=BOOK[k];
  d.innerHTML=vbg(.5)+`<button class="iconbtn back" onclick="go(scBook)">‹ Kitap</button>
   <div style="position:absolute;left:0;right:0;top:12px;text-align:center"><span class="parch" style="padding:2px 18px;font-weight:800;font-size:22px;border-radius:12px;border-width:3px">Sayfa ${BOOKPAGES[k].p} · ${k} · ${BOOKPAGES[k].t}</span></div>
   <div style="position:absolute;left:150px;right:150px;top:84px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px">
   ${L.map((e,i)=>{const s=bstat(k,i);return `<button class="node ${s==='ok'?'done':s==='seen'?'':'locked'}" style="position:relative;margin:0;width:90px;height:90px;${s==='seen'?'background:var(--yellow)':''}" onclick="go(scBookEx,'${k}',${i})" aria-label="Soru ${i+1}">${i+1}</button>`}).join('')}</div>
   <div class="parch" style="position:absolute;left:150px;right:150px;bottom:20px;padding:6px 14px;font-size:15px;font-weight:700;border-width:3px;border-radius:12px">Yeşil: doğru çözdün. Sarı: çözümüne baktın. Gri: henüz çözmedin.</div>`;
}
function scBookEx(d,k,i){
  const e=BOOK[k][i];let tries=0,solved=false,moves=0;
  const pos={...e.pos};const start=Object.keys(pos).find(s=>pos[s]==='R');
  d.innerHTML=vbg(.45)+`<button class="iconbtn back" onclick="go(scBookPage,'${k}')">‹ Sayfa ${BOOKPAGES[k].p}</button>
   <div style="position:absolute;left:40px;top:70px"><div class="bframe"><div id="bd"></div></div></div>
   <div class="parch qcard" style="left:470px;right:30px;top:70px">
     <div style="font-weight:800;color:var(--orange-d);font-size:17px">Sayfa ${BOOKPAGES[k].p} · Soru ${i+1}</div>
     <p class="qtext" style="font-size:23px">${e.q}</p>
     <div class="hint" id="hi">${e.t==='route'?'Kaleye, sonra gideceği kareye dokun.':'Karelere dokunarak işaretle, sonra kontrol et.'}</div>
     <div id="mc" style="font-weight:800;font-size:18px;margin-top:6px">${e.t==='route'?'Hamle: 0':''}</div>
     <div style="display:flex;gap:10px;margin-top:10px">${e.t==='mark'?'<button class="btn small" id="ck">Kontrol et</button>':''}<button class="btn small alt" id="sol" style="display:none">Çözümü göster</button></div>
     <div class="feedback" id="fb"></div></div>
   <div style="position:absolute;right:30px;bottom:18px;display:flex;gap:10px">
     ${i>0?`<button class="btn small alt" onclick="go(scBookEx,'${k}',${i-1})">‹ Önceki</button>`:''}
     ${i<BOOK[k].length-1?`<button class="btn small" onclick="go(scBookEx,'${k}',${i+1})">Sonraki ›</button>`:`<button class="btn small" onclick="go(scBookPage,'${k}')">Sayfaya dön</button>`}</div>`;
  const fb=d.querySelector('#fb'),hi=d.querySelector('#hi'),sol=d.querySelector('#sol'),mc=d.querySelector('#mc');
  const wrap=d.querySelector('.bframe').parentNode;
  function fail(msg){tries++;fb.className='feedback bad';fb.textContent=msg;hi.textContent='İpucu: '+e.h;
    wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake');if(tries>=2)sol.style.display='inline-block'}
  function win(){solved=true;fb.className='feedback ok';fb.textContent=(e.t==='route'?`${e.n} hamle, en kısa yol! `:'')+(tries?'Doğru! Sonunda buldun.':'Doğru! Harika.');setB(k,i,'ok');sol.style.display='none'}
  const goalFlag=()=>e.t==='route'?{[e.goal]:'goalsq'}:{};
  const B=makeBoard(d.querySelector('#bd'),pos,{onTap:s=>{if(solved)return;
    if(e.t==='mark'){B.marks.has(s)?B.marks.delete(s):B.marks.add(s);B.flags=goalFlag();B.draw();return}
    const cur=Object.keys(B.pos).find(x=>B.pos[x]==='R');
    if(B.sel===null){if(s===cur){B.sel=s;B.draw()}else{hi.textContent='Önce kaleye dokun.'}return}
    if(s===cur){B.sel=null;B.draw();return}
    if(!rookOk(B.pos,cur,s)){B.flags={...goalFlag(),[s]:'wrong'};B.sel=null;B.draw();hi.textContent='Kale oraya gidemez: düz gitmeli ve yolu açık olmalı.';setTimeout(()=>{B.flags=goalFlag();B.draw()},500);return}
    B.pos[s]='R';delete B.pos[cur];B.sel=null;moves++;mc.textContent=`Hamle: ${moves}`;B.flags=goalFlag();B.marks.add(s);B.draw();
    if(s===e.goal){if(moves<=e.n)win();else{fail(`Sarı kareye ${moves} hamlede ulaştın. Daha kısa bir yol var!`);reset()}}
    else if(moves>=e.n){fail('Daha kısa bir yol var. Baştan dene!');setTimeout(reset,700)}}});
  function reset(){B.pos={...e.pos};B.sel=null;B.marks.clear();moves=0;mc.textContent='Hamle: 0';B.flags=goalFlag();B.draw()}
  B.flags=goalFlag();B.draw();
  if(e.t==='mark')d.querySelector('#ck').onclick=()=>{if(solved)return;const ok=e.a.length===B.marks.size&&e.a.every(s=>B.marks.has(s));
    if(ok){B.flags={};e.a.forEach(s=>B.flags[s]='good');B.draw();win()}
    else{B.flags={};[...B.marks].forEach(s=>{if(!e.a.includes(s))B.flags[s]='wrong'});B.draw();
      fail(B.marks.size<e.a.length?'Eksik kare var, tekrar bak!':'Bazı kareler yanlış, tekrar bak!')}};
  sol.onclick=()=>{solved=true;setB(k,i,'seen');sol.style.display='none';fb.className='feedback';fb.style.color='var(--wood)';
    if(e.t==='mark'){B.marks.clear();B.flags={};e.a.forEach(s=>B.flags[s]='good');B.draw();fb.textContent=k==='B'?'Çözüm: '+e.a.join(', '):`Çözüm: ${e.a.length} kare`}
    else{reset();B.flags={[e.goal]:'goalsq'};e.a.slice(1).forEach(s=>B.flags[s]='good');B.draw();fb.textContent=`En az ${e.n} hamle. Örnek yol: `+e.a.join(' → ')}};
}
function rookOk(pos,a,b){if(a[0]!==b[0]&&a[1]!==b[1])return false;const F='abcdefgh';
  const df=Math.sign(F.indexOf(b[0])-F.indexOf(a[0])),dr=Math.sign(+b[1]-+a[1]);
  let f=F.indexOf(a[0])+df,r=+a[1]+dr;
  while(F[f]+r!==b){if(pos[F[f]+r])return false;f+=df;r+=dr}
  const p=pos[b];return !p||p!==p.toUpperCase()}

/* QR / derin bağlantı: #bolum-4, #kitap, #kitap-A */
function route(){const h=location.hash;const kb=h.match(/kitap-([ABC])/);if(kb){S.logged=true;if(!S.av)S.av='e';save();go(scBookPage,kb[1]);return true}
  if(/#kitap-video/.test(h)){S.logged=true;if(!S.av)S.av='e';save();go(scBookVideo);return true}
  if(/#kitap/.test(h)){S.logged=true;if(!S.av)S.av='e';save();go(scBook);return true}
  const m=h.match(/bolum-(\d+)/);if(m){const i=+m[1]-1;if(i>=0&&i<NL){S.logged=true;if(!S.av)S.av='e';if(!S.nick)S.nick='Misafir';save();startLesson(i);return true}}return false}
if(!route())go(scSplash);addEventListener('hashchange',route);
if(/[?&]dev/.test(location.search)){const t=document.createElement('div');t.style.cssText='position:fixed;left:6px;bottom:6px;z-index:200;display:flex;gap:6px;font:12px sans-serif';
  [['+100 altın',()=>{S.gold+=100;save();toast('+100 altın')}],['Bölümleri bitir',()=>{S.done=S.done.map(()=>true);S.st=S.st.map(()=>2);save();go(scUnit)}],['Sonraki saat',()=>{S.hourOff=(S.hourOff||0)+1;save();toast('1 saat ileri')}],['Sıfırla',()=>{S=fresh();save();go(scSplash)}]].forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.style.cssText='padding:3px 8px;opacity:.85';b.onclick=f;t.appendChild(b)});document.body.appendChild(t)}
</script>
</body>
