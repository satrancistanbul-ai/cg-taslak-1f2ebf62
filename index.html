<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chessigo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a1a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chessigo">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3B2314; --wood:#7A4A24; --wood-d:#4E2E14; --wood-l:#A0703F;
  --orange:#F6A12B; --orange-d:#C9731A; --yellow:#FCC73C; --red:#D7261E;
  --parch:#FFF4DC; --parch-d:#EBD7AE; --grass:#6DAA3F; --grass-d:#4C7F2A;
  --sq-l:#F5F5F5; --sq-d:#6F6F6F;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#2a1a0e;font-family:var(--font);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#boot{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 40%,#5E3A1C,#2a1a0e 70%);transition:opacity .6s ease}
#boot::before{content:"";position:absolute;inset:-80px;opacity:.07;background:repeating-conic-gradient(#FCC73C 0 25%,transparent 0 50%) 0 0/80px 80px;animation:ykkay 18s linear infinite}
@keyframes ykkay{to{transform:translate(80px,80px)}}
#boot.bitti{opacity:0;pointer-events:none}
#boot .yk{position:relative;display:flex;flex-direction:column;align-items:center;gap:min(1.6vh,12px);width:min(86vw,520px)}
#boot .yk-sahne{position:relative;width:min(28vh,170px);height:min(30vh,182px);display:flex;justify-content:center}
#yk-ikon{position:relative;z-index:1;width:min(24vh,140px);height:min(24vh,140px);border-radius:30%;box-shadow:0 8px 0 #1a0f07,0 0 0 4px #3B2314;animation:ykzip 1.1s cubic-bezier(.3,0,.4,1) infinite;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#yk-ikon.zip{animation:ykdon .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes ykzip{0%,100%{transform:translateY(0) scale(1.06,.94)}12%{transform:translateY(0) scale(1)}50%{transform:translateY(-22%) scale(.97,1.04)}88%{transform:translateY(0) scale(1)}}
@keyframes ykdon{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-45%) rotate(200deg) scale(1.1)}100%{transform:translateY(0) rotate(360deg)}}
#boot .yk-golge{position:absolute;bottom:0;width:62%;height:12%;border-radius:50%;background:rgba(0,0,0,.45);animation:ykgol 1.1s cubic-bezier(.3,0,.4,1) infinite}
@keyframes ykgol{0%,100%,12%,88%{transform:scale(1);opacity:.55}50%{transform:scale(.6);opacity:.25}}
#boot .yk-ad{color:#FCC73C;font-weight:800;font-size:clamp(34px,7vh,60px);line-height:1;letter-spacing:1px;text-shadow:0 4px 0 #3B2314}
#boot .yk-bar{position:relative;width:100%;height:clamp(22px,4.4vh,30px);border-radius:20px;background:#3B2314;border:3px solid #1a0f07;box-shadow:inset 0 3px 6px rgba(0,0,0,.5),0 2px 0 rgba(255,220,160,.15);overflow:hidden}
#yk-dol{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:16px;background:linear-gradient(#FFC15A,#F6A12B 55%,#E0821C);box-shadow:inset 0 3px 0 rgba(255,255,255,.55);transition:width .35s ease}
#yk-dol::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 10px,transparent 10px 20px);animation:ykser .8s linear infinite}
@keyframes ykser{to{background-position:28px 0}}
#yk-yuzde{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(13px,2.6vh,18px);text-shadow:0 1.5px 0 #3B2314,0 0 3px #3B2314}
#yk-ipucu{min-height:2.6em;color:#F5E6C4;font-weight:700;font-size:clamp(14px,2.8vh,19px);line-height:1.25;text-align:center;transition:opacity .35s,transform .35s}
#yk-ipucu::before{content:"Biliyor muydun? ";color:#FCC73C;font-weight:800}
#yk-ipucu.sol{opacity:0;transform:translateY(6px)}
#yk-sayac{position:absolute;top:4%;right:-6%;color:#fff;font-weight:800;font-size:clamp(13px,2.6vh,17px);background:#E2574C;border:2px solid #3B2314;border-radius:12px;padding:0 8px;opacity:0;transform:scale(.6);transition:all .2s}
#yk-sayac.var{opacity:1;transform:scale(1)}
#boot .yk-dokun{color:rgba(245,230,196,.6);font-size:clamp(11px,2.2vh,14px);font-weight:700;margin-top:-6px}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#8FD0EE;border-radius:18px}
.screen{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
button{font-family:var(--font);cursor:pointer;border:none;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,.sq:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

.btn{background:var(--orange);color:var(--ink);font-weight:800;font-size:24px;padding:10px 30px;border-radius:16px;border:3px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--parch)}
.btn.small{font-size:18px;padding:4px 16px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn[disabled]{background:#d8cbb0;color:#8d7a5e;border-color:#8d7a5e;box-shadow:0 5px 0 #8d7a5e;cursor:default}
.iconbtn{background:var(--parch);border:3px solid var(--ink);border-radius:12px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;padding:0 12px;gap:6px;box-shadow:0 3px 0 var(--ink)}
.back{position:absolute;left:14px;top:12px;z-index:5}

.goldbox{display:inline-flex;align-items:center;gap:6px;background:var(--wood-d);color:var(--yellow);font-weight:800;font-size:20px;border-radius:22px;
  padding:4px 14px 4px 6px;height:44px;border:3px solid var(--yellow)}
.goldbox.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.2)}}
.coin{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF0B0,var(--yellow) 55%,var(--orange-d));border:2px solid #8a5200;position:relative}
.coin::after{content:"♟\FE0E";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#8a5200;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.flycoin{position:absolute;z-index:50;width:32px;height:32px;pointer-events:none;transition:left .7s cubic-bezier(.5,-.3,.7,1),top .7s cubic-bezier(.3,0,.3,1.2),transform .7s}

.parch{background:var(--parch);border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 rgba(59,35,20,.55)}
.field{display:block;width:100%;font-family:var(--font);font-size:20px;padding:6px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin:2px 0 10px}
label.l{font-weight:700;font-size:17px}
.link{color:var(--wood-d);font-weight:700;text-decoration:underline;background:none;font-size:16px;padding:0}
.hint{font-size:16px;font-weight:600;color:#7a6146}

.scrim{position:absolute;inset:0;background:rgba(40,22,10,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:absolute;left:0;top:0;bottom:0;width:300px;background:var(--parch);z-index:21;border-right:4px solid var(--ink);transform:translateX(-100%);transition:transform .25s;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.panel.open{transform:none}
.panel button.item{background:none;text-align:left;font-size:22px;font-weight:700;padding:6px 10px;border-radius:12px}
.panel button.item:hover{background:var(--parch-d)}
.panel .soon{font-size:14px;color:#9a8266;font-weight:600;margin-left:6px}

.toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;font-weight:700;font-size:18px;padding:8px 20px;border-radius:14px;z-index:60;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}

.stat{background:var(--parch);border:3px solid var(--ink);border-radius:16px;padding:4px 14px;text-align:center;min-width:140px;box-shadow:0 4px 0 rgba(59,35,20,.5)}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:15px;font-weight:700;color:var(--wood)}
.rank{display:flex;gap:4px;justify-content:center;margin-top:2px}
.rank i{font-style:normal;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:#e2d3b3;color:#9a8266;
  font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.rank i.on{background:var(--orange);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

.platform{position:absolute;left:34px;top:300px;width:320px;height:190px}
.platform .disc{position:absolute;left:10px;right:10px;bottom:4px;height:72px;border-radius:50%;background:var(--wood);border:4px solid var(--ink);box-shadow:0 10px 0 var(--wood-d)}
.platform .disc2{position:absolute;left:36px;right:36px;bottom:26px;height:46px;border-radius:50%;background:var(--wood-l);border:3px solid var(--ink)}
.platform .go{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);font-size:32px;padding:8px 40px;white-space:nowrap}
.platform .gp{position:absolute;font-size:46px;color:var(--parch);-webkit-text-stroke:2px var(--ink);font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif;line-height:1}

.mapscroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.node{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;
  border:4px solid var(--ink);background:var(--orange);color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.node.locked{background:#cdbf9f;color:#7a6146;cursor:default}
.node.done{background:var(--grass);color:#fff}
.node.cur{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),0 0 0 12px rgba(252,199,60,.45)}}
.nodelabel{position:absolute;transform:translateX(-50%);font-weight:800;font-size:15px;background:var(--parch);border-radius:8px;padding:0 8px;border:2px solid var(--ink);white-space:nowrap}

.bubble{position:absolute;background:#fff;border:4px solid var(--ink);border-radius:24px;padding:12px 20px;font-weight:700;font-size:23px;line-height:1.25;max-width:400px;
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);z-index:6}
.bubble.in{opacity:1;transform:scale(1)}
.bubble b.who{display:block;font-size:15px;color:var(--orange-d)}
.bubble::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border:4px solid var(--ink);border-top:none;border-left:none}
.bubble.tail-right::after{right:-15px;bottom:24px;transform:rotate(-45deg)}
.bubble.tail-left::after{left:-15px;bottom:24px;transform:rotate(135deg)}
.bubble.tail-down::after{left:40px;bottom:-15px;transform:rotate(45deg)}
.sesbtn{position:absolute;right:6px;top:5px;width:30px;height:30px;border-radius:50%;background:var(--parch);border:2px solid var(--ink);font-size:15px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--ink);z-index:1}
.sesbtn:active{transform:translateY(2px);box-shadow:none}
.bubble:has(.sesbtn) b.who{padding-right:32px}

.list{position:absolute;left:380px;right:20px;top:66px;bottom:14px;overflow-y:auto;padding:6px 10px 10px 4px}
.row{display:flex;align-items:center;gap:14px;background:var(--parch);border:3px solid var(--ink);border-radius:16px;padding:7px 12px;margin-bottom:10px}
.row .num{width:40px;height:40px;border-radius:50%;background:var(--wood);color:var(--yellow);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--ink)}
.row.done .num{background:var(--grass);color:#fff}
.row.locked{opacity:.6}
.row .t{flex:1;font-weight:700;font-size:20px;line-height:1.15}
.row .t small{display:block;font-size:14px;color:#9a8266;font-weight:600}
.bar{height:16px;background:#e2d3b3;border-radius:8px;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass)}

.screenframe{position:absolute;background:var(--wood);border:6px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 8px 0 var(--wood-d)}
.vscreen{background:#1f3a2b;border-radius:8px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.play{width:88px;height:88px;border-radius:50%;background:var(--orange);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
.play::before{content:"";border-left:32px solid var(--ink);border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:8px}

.qtop{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 140px;z-index:3}
.qtop .title{font-weight:800;font-size:20px;background:var(--parch);border:3px solid var(--ink);border-radius:12px;padding:2px 12px}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;background:#e2d3b3;border:2px solid var(--ink)}
.dots i.on{background:var(--orange)}.dots i.ok{background:var(--grass)}
.qcard{position:absolute;padding:16px 22px}
.qtext{font-weight:700;font-size:26px;line-height:1.25;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{background:#fff;border:3px solid var(--ink);border-radius:16px;font-size:21px;font-weight:700;padding:14px 12px;text-align:left;line-height:1.2;box-shadow:0 4px 0 var(--ink)}
.opt b{color:var(--orange-d);margin-right:6px}
.opt.ok{background:#e1f2d3;border-color:var(--grass-d)}
.opt.bad{background:#f9ddd6;border-color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{font-weight:800;font-size:22px;min-height:32px;margin-top:8px}
.feedback.ok{color:var(--grass-d)}.feedback.bad{color:var(--red)}

/* Stone-framed board */
.bframe{display:inline-block;padding:10px 12px 4px 4px;border-radius:14px;border:4px solid var(--ink);
  background-color:#8a5a30;background-image:linear-gradient(90deg,rgba(59,35,20,.35) 3px,transparent 3px),linear-gradient(rgba(59,35,20,.35) 3px,transparent 3px);
  background-size:52px 30px;box-shadow:inset 0 0 0 4px #a8773f,0 7px 0 var(--wood-d)}
.board{display:grid;grid-template-columns:20px repeat(8,40px);grid-template-rows:repeat(8,40px) 22px}
.board.nocoord .coord{color:transparent;text-shadow:none}
.coord{color:var(--yellow);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 var(--ink)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:38px;line-height:1;cursor:pointer;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.board .r0{border-top-left-radius:10px}.board .r1{border-top-right-radius:10px}.board .r2{border-bottom-left-radius:10px}.board .r3{border-bottom-right-radius:10px}
.pc{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:100%;pointer-events:none}
.pc svg{width:37px;height:37px;display:block;overflow:visible;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 1.5px 0 rgba(20,11,4,.35))}
.pc.w svg *{fill:#fffdf4;stroke:#2a1608}
.pc.b svg *{fill:#3a281a;stroke:#120a04}
.pc.w svg .d{fill:none;stroke:#2a1608;stroke-width:1.6}
.pc.b svg .d{fill:none;stroke:#f3e6c8;stroke-width:1.6}
.pc.w svg .e{fill:#2a1608;stroke:none}
.pc.b svg .e{fill:#f3e6c8;stroke:none}
.sq.sel{box-shadow:inset 0 0 0 4px var(--orange)}
.sq.mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:rgba(252,199,60,.9);border:3px solid var(--orange-d);z-index:1}
.sq.good{box-shadow:inset 0 0 0 4px #2f7d1a;background:#bfe3a8}
.sq.wrong{box-shadow:inset 0 0 0 4px var(--red)}
.sq.goalsq{background:#FCC73C}

.items{position:absolute;left:380px;right:20px;top:70px;bottom:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.item{background:var(--parch);border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.item .nm{font-weight:800;font-size:16px;line-height:1.1}
.item .pr{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--orange-d)}
.item .pr .coin{width:20px;height:20px}.item .pr .coin::after{font-size:10px}

.pick{width:230px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;border-radius:22px}
.pick.sel{background:var(--yellow)}

#rotate{position:fixed;inset:0;background:#2a1a0e;color:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#rotate .ph{width:70px;height:120px;border:6px solid var(--orange);border-radius:14px;animation:rot 2s infinite ease-in-out}
@keyframes rot{40%,70%{transform:rotate(-90deg)}}
#rotate p{font-size:24px;font-weight:700;margin:0;max-width:300px}
@media (orientation:portrait){body:not(.force) #rotate{display:flex}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.chr{position:relative;height:100%;margin:0 auto;max-width:100%}
.chsh{position:absolute;left:-6%;right:-6%;bottom:-1.5%;height:4%;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(1px)}
.hop{animation:hop .55s cubic-bezier(.3,.9,.5,1) 3}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}20%{transform:translateY(0) scaleY(.96)}50%{transform:translateY(-9%) scaleY(1.03) rotate(-2deg)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.opts.two{grid-template-columns:repeat(2,1fr)}
.items{overflow-y:auto;padding:2px 4px 4px 0;scrollbar-width:none}.items::-webkit-scrollbar{display:none}
.birds{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.sbird{position:absolute;left:1030px;top:34px;width:160px;height:81px;background-size:960px 324px;animation:fly 30s linear infinite}
@keyframes fly{0%{left:1030px;margin-top:8px}50%{margin-top:-14px}100%{left:-170px;margin-top:0}}
.fly{position:absolute;z-index:1;pointer-events:none;animation:flit 6s ease-in-out infinite}
@keyframes flit{0%{transform:translate(0,0)}25%{transform:translate(26px,-18px)}50%{transform:translate(52px,4px)}75%{transform:translate(20px,-22px)}100%{transform:translate(0,0)}}
</style>

      return oku().then(function(){ var b = new Uint8Array(n), o = 0; parca.forEach(function(p){ b.set(p, o); o += p.length; }); alinan[d.u] = d.n; guncelle(); return new TextDecoder().decode(b); });
    });
  }
  function resimler(){ RESIM.forEach(function(d){ var i = new Image(); i.onload = i.onerror = function(){ alinan[d.u] = d.n; guncelle(); resimTamam++;
      if (resimTamam === RESIM.length && resimBekleyen) resimBekleyen(); }; i.src = d.u; }); }
  function calistir(metinler){ metinler.forEach(function(t){ var s = document.createElement("script"); s.textContent = t; document.body.appendChild(s); }); }
  // file:// ya da fetch olmayan ortam: dosyalar <script src> ile sırayla yüklenir, ilerleme dosya sayısına göre
  function yedek(){ var i = 0; (function sonraki(){ if (i >= DOSYA.length) return; var d = DOSYA[i++], s = document.createElement("script"); s.src = d.u;
      s.onload = function(){ alinan[d.u] = d.n; guncelle(); sonraki(); }; document.body.appendChild(s); })(); }
  // uygulama hazır olunca ilk ekranın resimleri de gelmiş olmalı (yoksa ekran bir an arka plansız görünür); en çok 8 sn beklenir
  window.ykBitir = function(){
    var b = document.getElementById("boot"); if (!b) return;
    var kapat = function(){ resimBekleyen = null; var bekle = Math.max(0, 900 - (Date.now() - bas));
      setTimeout(function(){ for (var k in alinan) alinan[k] = Infinity; gosterilen = 1; dol.style.width = "100%"; yz.textContent = "100%";
        clearInterval(ipT); b.classList.add("bitti"); setTimeout(function(){ b.remove(); }, 650); }, bekle); };
    if (resimTamam >= RESIM.length) kapat(); else { resimBekleyen = kapat; setTimeout(function(){ if (resimBekleyen) kapat(); }, 8000); }
  };
  resimler();
  Promise.all(DOSYA.map(getir)).then(calistir, yedek);
})();

</script>
