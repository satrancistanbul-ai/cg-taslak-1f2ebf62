<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chessigo — Ünite 1 taslağı</title>
<style>
:root{--si:#182B53;--si2:#294B9C;--si3:#5D85C3;--or:#F16524;--yel:#FFC93C;--cream:#FFF4D6;--br:#5b3a1e;--g:#769656;--w:#eeeed2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Poppins","Segoe UI",system-ui,sans-serif;background:#1c1206;color:var(--br)}
#frame{position:relative;width:100vw;height:100vh;max-width:1100px;max-height:620px;margin:auto;top:50%;transform:translateY(-50%);overflow:hidden;background:linear-gradient(#9fd6ff,#d7f0ff 55%,#9bd07a 55%,#7ab35e);border-radius:14px}
@media (max-height:640px){#frame{max-height:100vh;border-radius:0}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 16px 64px;overflow:auto}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pill{background:var(--cream);border:3px solid var(--br);border-radius:22px;padding:4px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--br)}
.pill.gold{background:var(--yel)}
.btn{background:var(--or);color:#fff;border:3px solid var(--br);border-radius:14px;padding:10px 22px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--br);font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--br)}
.btn.blue{background:var(--si2)}.btn.ghost{background:var(--cream);color:var(--br)}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--cream);border:4px solid var(--br);border-radius:16px;padding:14px}
h1{font-size:28px}h2{font-size:20px;margin-bottom:6px}h3{font-size:15px}
small,.muted{opacity:.75;font-size:12px}
.center{margin:auto;text-align:center}
.nav{position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--si);display:flex;justify-content:center;gap:6px;padding:6px;z-index:5}
.nav button{flex:1;max-width:190px;border:0;border-radius:10px;background:var(--si2);color:#fff;font-weight:700;font-family:inherit;cursor:pointer}
.nav button.on{background:var(--or)}
.nav button.book{background:var(--si3)}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:6px solid #8b6a3e;border-radius:6px;width:min(100%,390px);aspect-ratio:1;position:relative;user-select:none;background:#8b6a3e}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,4.6vw,34px);line-height:1;cursor:pointer}
.sq.l{background:var(--w)}.sq.d{background:var(--g)}
.sq .p{font-family:"Segoe UI Symbol","Apple Symbols",serif}
.sq .p.w{color:#fff;-webkit-text-stroke:1.2px #222;paint-order:stroke fill}.sq .p.b{color:#1d1d1d}
.sq.sel{outline:4px solid var(--or);outline-offset:-4px;background:#f6d365}
.sq.src{outline:4px solid var(--si2);outline-offset:-4px}
.sq.vur::after{content:"";position:absolute;inset:8%;border:4px solid var(--or);border-radius:50%}
.sq.ok{background:#7fd77f}.sq.bad{background:#f28b82}.sq.show{background:#ffe08a}
.co{position:absolute;font-size:10px;font-weight:800;color:#ffd84a;-webkit-text-stroke:.6px #5b3a1e;paint-order:stroke fill;pointer-events:none}
.co.f{bottom:1px;right:3px}.co.r{top:1px;left:3px}
.qwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.opt{display:block;width:100%;margin:6px 0;text-align:left}
.opt.wrong{background:#c0392b;opacity:.6}.opt.right{background:#2e9e4f}
.bub{background:#fff;border:3px solid var(--br);border-radius:16px;padding:10px 14px;font-size:15px;position:relative;flex:1}
.av{width:56px;height:56px;border-radius:50%;border:3px solid var(--br);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;flex:none;overflow:hidden;background:var(--si2)}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;gap:10px}
.island{width:150px;height:110px;border-radius:50% 50% 45% 45%;background:radial-gradient(#ffe08a,#e2b84f);border:4px solid var(--br);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:13px;cursor:pointer;flex:none;padding:6px}
.island.lock{background:#b9b9b9;color:#666;cursor:not-allowed}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--br);border-radius:12px;margin-bottom:6px;background:#fff;cursor:pointer}
.it.lock{opacity:.5;cursor:not-allowed}.it.done{background:#e3f7e3}
.num{width:30px;height:30px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.vid{aspect-ratio:16/8;background:linear-gradient(135deg,#2b1d10,#0f0a05);border:6px solid #8b6a3e;border-radius:10px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;max-width:520px;width:100%}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .pill.on{background:var(--or);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:2px solid #d9c9a0;text-align:left}
tr.me{background:#ffe08a;font-weight:800}
input[type=text]{border:3px solid var(--br);border-radius:12px;padding:8px 12px;font-size:16px;font-family:inherit;width:100%;max-width:280px}
.tool{position:absolute;left:50%;transform:translateX(-50%);top:4px;z-index:9;white-space:nowrap}
.tool button{font-size:10px;opacity:.5;border:1px solid #999;border-radius:6px;background:#fff;cursor:pointer;margin-left:2px}
.tool button:hover{opacity:1}
.tag{display:inline-block;background:var(--si2);color:#fff;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:700}
.tag.or{background:var(--or)}
.fb{margin-top:8px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:14px}
.fb.ok{background:#d9f7d9}.fb.no{background:#fde0dc}
.hint{background:#fff3c4}
</style>
</head>

/* ---------- tahta ---------- */
const GL={K:"♚",Q:"♛",R:"♜",B:"♝",N:"♞",P:"♟"};
function boardHTML(spec,st){
 st=st||{};let h='<div class="board" id="bd">';
 for(let r=8;r>=1;r--)for(let f=0;f<8;f++){
  const sq="abcdefgh"[f]+r,pc=spec.taslar[sq],dark=(f+r)%2===0;
  let cl="sq "+(dark?"d":"l");
  if((spec.vurgu||[]).includes(sq))cl+=" vur";
  if(st.sel&&st.sel.includes(sq))cl+=" sel";
  if(st.src===sq)cl+=" src";
  if(st.ok&&st.ok.includes(sq))cl+=" ok";if(st.bad&&st.bad.includes(sq))cl+=" bad";if(st.show&&st.show.includes(sq))cl+=" show";
  h+=`<div class="${cl}" data-sq="${sq}">${pc?`<span class="p ${pc===pc.toUpperCase()?'w':'b'}">${GL[pc.toUpperCase()]}︎</span>`:""}${r===1?`<span class="co f">${"abcdefgh"[f]}</span>`:""}${f===0?`<span class="co r">${r}</span>`:""}</div>`}
 return h+"</div>"}

/* ---------- soru motoru ---------- */
function runQ(list,i,ctx){
 const q=list[i],box=$("#qbox");let att=0,done=false,sel=[],src=null;
 const head=`<div class="row" style="justify-content:space-between"><h3>${ctx.title} — Soru ${i+1}/${list.length}</h3>${ctx.gold?`<span class="pill gold">Altın: ${ctx.kazan}</span>`:'<span class="tag">altın yok</span>'}</div>`;
 const fb=(t,ok)=>`<div class="fb ${ok?'ok':'no'}">${t}</div>`;
 const finish=()=>{done=true;const g=att===0?DATA.altin.ilk_deneme:DATA.altin.sonraki;
  if(att===0)ctx.ilk++;if(ctx.gold&&ctx.gorevGold){ctx.kazan+=g;}
  const info=ctx.gold?(ctx.gorevGold?`+${g} altın`:"Tekrar: altın yok"):"";
  draw(fb(`Doğru! ${esc(q.aciklama)} ${info}`,true),true)};
 const wrong=()=>{att++;draw(fb(att===1?"Olmadı, tekrar dene. Küçük ipucu: "+esc(q.ipucu||"Videoyu hatırla."):"Bir daha dene. İlk denemede 10, sonraki denemelerde 5 altın kazanılır.",false))};
 function draw(msg,ok){
  let body="";
  if(q.tip==="mc"){
   body=`<div class="qwrap">${q.tahta?boardHTML(q.tahta,{}):""}<div style="flex:1;min-width:240px"><h2>${esc(q.soru)}</h2>${q.secenekler.map((o,k)=>`<button class="btn blue opt ${q._x&&q._x[k]?'wrong':''} ${done&&k===q.dogru?'right':''}" data-k="${k}" ${done?'disabled':''}>${esc(o)}</button>`).join("")}</div></div>`}
  else{const st={sel:q.tip==="isaretle"?sel:[],src:src,ok:done?(q.tip==="isaretle"?q.dogru:q.hedefler):[]};
   body=`<div class="qwrap">${boardHTML(q.tahta,st)}<div style="flex:1;min-width:240px"><h2>${esc(q.soru)}</h2>${q.tip==="isaretle"?`<p class="muted">Kareleri seçmek için dokun, tekrar dokunarak kaldır.</p><button class="btn" id="chk" ${done?'disabled':''}>Kontrol et</button>`:`<p class="muted">Önce taşa, sonra gideceği kareye dokun.</p>`}</div></div>`}
  box.innerHTML=head+body+(msg||"")+(done?`<div style="margin-top:10px"><button class="btn" id="nx">${i+1<list.length?"Sonraki soru":"Bitir"}</button></div>`:"");
  bind()}
 function bind(){
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done)return;const k=+b.dataset.k;if(k===q.dogru)finish();else{q._x=q._x||{};q._x[k]=1;wrong()}});
  box.querySelectorAll(".sq").forEach(s=>s.onclick=()=>{if(done)return;const sq=s.dataset.sq;
   if(q.tip==="isaretle"){sel=sel.includes(sq)?sel.filter(x=>x!==sq):[...sel,sq];draw()}
   else if(q.tip==="hamle"){if(!src){if(sq===q.kaynak){src=sq;draw()}else{draw(fb("Önce hamle yapacağın taşa dokun.",false))}}
    else if(sq===src){src=null;draw()}
    else if(q.hedefler.includes(sq))finish();else{src=null;wrong()}}});
  const c=$("#chk");if(c)c.onclick=()=>{const ok=sel.length===q.dogru.length&&q.dogru.every(x=>sel.includes(x));if(ok)finish();else{att++;
    const yanlis=sel.filter(x=>!q.dogru.includes(x)).length,eksik=q.dogru.filter(x=>!sel.includes(x)).length;
    draw(fb(`Henüz değil: ${eksik} kare eksik, ${yanlis} kare fazla. ${att===1?esc(q.ipucu):"Bir daha dene."}`,false))}};
  const n=$("#nx");if(n)n.onclick=()=>{if(i+1<list.length)runQ(list,i+1,ctx);else ctx.bitti(ctx)}}
 draw()}
const deep=o=>JSON.parse(JSON.stringify(o));

 <p class="muted" style="margin-top:10px">Haritada herkes görünmez; oyuncular yalnızca arama ile bulunur. Profilde gerçek ad, fotoğraf, şube yok.</p></div>${nav("ara")}`;
 $("#sb").onclick=()=>go("ara",{q:$("#q").value.trim()})},
kitap(){const p=S.p||{};
 if(!S.kitapKod){app.innerHTML=`<div class="scr center" style="justify-content:center;background:#dbe7fb"><div class="card" style="max-width:520px"><span class="tag">Oyundan bağımsız bölüm</span><h2 style="margin-top:6px">Kitap Çözümleri</h2><p>Kitabındaki QR kodu okuttun ya da kitap kodunu gir. Burada altın, seviye ve liderlik yoktur; kitapta o sayfada ne anlatıldıysa onun videosu ve alıştırma çözümleri vardır.</p><input type="text" id="kk" placeholder="Kitap kodu (taslakta herhangi bir kod)" style="margin:8px 0"><br><button class="btn blue" id="kb">Kitabı aç</button></div></div>${nav("kitap")}`;$("#kb").onclick=()=>{if($("#kk").value.trim()){S.kitapKod=1;save();render()}};return}
 if(p.no){const b=D.find(x=>x.no===p.no),qs=b.sorular.filter(q=>q.tip!=="mc"),q=deep(qs[0]||b.sorular[0]);
  app.innerHTML=`<div class="scr" style="background:#dbe7fb"><div class="row" style="margin-bottom:6px"><button class="btn ghost" onclick="go('kitap')">Geri</button><span class="tag">Kitap Çözümleri</span><span class="tag or">altın yok</span></div>
  <div class="vid" style="margin-bottom:8px;max-width:300px;aspect-ratio:16/6"><div style="font-size:24px">▶</div><b>Konu ${b.no} videosu: ${esc(b.video.baslik)}</b><small>QR ile buraya gelinir</small></div>
  <div class="card" id="qbox"></div></div>${nav("kitap")}`;
  runQ([q],0,{title:"Alıştırma (kitap sayfası)",gold:false,ilk:0,kazan:0,bitti:()=>go("kitap")});return}
 app.innerHTML=`<div class="scr" style="background:#dbe7fb"><div class="row"><span class="tag">Oyundan bağımsız</span><h2 style="margin-left:6px">Kitap 1 · ${DATA.baslik}</h2></div><p class="muted">Sayfayı seç: video ve alıştırma çözümü. İlerleme kaydedilir, oyuna karışmaz.</p><div class="list">${D.map(b=>`<div class="it" onclick="go('kitap',{no:${b.no}})"><span class="num" style="background:var(--si2)">${b.no}</span><div style="flex:1"><b>${esc(b.baslik)}</b><br><small>Video + alıştırma çözümleri</small></div></div>`).join("")}</div></div>${nav("kitap")}`}
};
function buy(id){const i=IT[id];if(S.altin<i.fiyat)return;S.altin-=i.fiyat;S.sahip[id]=1;S.giyili[i.slot]=id;save();render()}
function wear(id){const i=IT[id];if(S.giyili[i.slot]===id)delete S.giyili[i.slot];else S.giyili[i.slot]=id;save();render()}
function render(){if(S.ekran==='test'||S.ekran==='video')S.ekran='unite';if(S.ekran==='bolum'&&!(S.p&&S.p.no))S.ekran='unite';(R[S.ekran]||R.acilis)()}
render();
</script>
